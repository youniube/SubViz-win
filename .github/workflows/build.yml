name: Build SubViz Release

on:
  push:
    tags:
      - 'v*'

  release:
    types: [published]

  workflow_dispatch:
    inputs:
      release_tag:
        description: '可选：要发布的 tag，例如 v1.0.4；留空则只构建当前选择的 ref'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve build metadata
        id: meta
        shell: bash
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_EVENT_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          tag="${INPUT_RELEASE_TAG:-}"

          if [[ -z "$tag" && "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME:-}"
          fi

          if [[ -z "$tag" && -n "${RELEASE_EVENT_TAG:-}" ]]; then
            tag="$RELEASE_EVENT_TAG"
          fi

          if [[ -n "$tag" ]]; then
            if [[ ! "$tag" =~ ^v[0-9A-Za-z._-]+$ ]]; then
              echo "::error::release_tag 必须以 v 开头，例如 v1.0.4。当前值：$tag"
              exit 1
            fi

            git fetch --force --tags origin

            if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "::error::远端没有找到 tag：$tag。请先执行 git push origin $tag，或在 GitHub 上创建这个 tag。"
              echo "当前远端可见的最近 tag："
              git tag --list 'v*' --sort=-creatordate | head -n 20 || true
              exit 1
            fi

            git checkout --force "refs/tags/$tag"
            zip_name="SubViz-windows-x64-${tag}.zip"
          else
            zip_name="SubViz-windows-x64-${GITHUB_REF_NAME:-manual}.zip"
          fi

          commit_sha="$(git rev-parse --short HEAD)"

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "zip_name=$zip_name" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$commit_sha" >> "$GITHUB_OUTPUT"

          echo "event=${GITHUB_EVENT_NAME}"
          echo "github_ref=${GITHUB_REF}"
          echo "github_ref_type=${GITHUB_REF_TYPE:-}"
          echo "github_ref_name=${GITHUB_REF_NAME:-}"
          echo "release_tag=${tag:-<artifact-only>}"
          echo "build_commit=${commit_sha}"
          echo "zip_name=${zip_name}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run tests
        run: npm test

      - name: Download Node.js portable
        shell: bash
        run: |
          set -euo pipefail
          NODE_VER="v20.18.0"
          curl -fL "https://nodejs.org/dist/${NODE_VER}/node-${NODE_VER}-win-x64.zip" -o node-win.zip
          unzip -q node-win.zip
          mkdir -p dist/node
          cp -r node-${NODE_VER}-win-x64/* dist/node/

      - name: Download mihomo Windows x64
        shell: bash
        run: |
          set -euo pipefail
          release_json="$(curl -fsSL https://api.github.com/repos/MetaCubeX/mihomo/releases/latest)"
          asset_url="$(printf '%s' "$release_json" | jq -r '.assets[] | select(.name | test("mihomo-windows-amd64.*\\.zip$")) | .browser_download_url' | head -n 1)"

          if [[ -z "$asset_url" || "$asset_url" == "null" ]]; then
            echo "::error::未找到 mihomo windows amd64 zip 资产"
            printf '%s' "$release_json" | jq -r '.assets[].name'
            exit 1
          fi

          echo "mihomo_asset=$asset_url"
          curl -fL "$asset_url" -o mihomo.zip
          unzip -q mihomo.zip -d dist/mihomo/
          find dist/mihomo -iname 'mihomo*.exe' -exec mv {} dist/mihomo/mihomo.exe \; -quit
          test -f dist/mihomo/mihomo.exe

      - name: Assemble release package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/lib dist/public dist/data dist/mihomo dist/src dist/tools dist/test
          cp server.js package.json README.md SubViz.bat SubViz.sh dist/
          if [[ -f subviz.js ]]; then cp subviz.js dist/; fi
          cp -r lib/* dist/lib/
          cp -r public/* dist/public/
          cp -r src dist/src
          cp -r tools dist/tools
          cp -r test dist/test
          touch dist/data/.gitkeep

      - name: Verify release layout
        run: node tools/verify-release-layout.js dist

      - name: Create ZIP
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          zip -r "../${{ steps.meta.outputs.zip_name }}" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SubViz-windows-x64-${{ steps.meta.outputs.commit_sha }}
          path: ${{ steps.meta.outputs.zip_name }}

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        if: steps.meta.outputs.tag != ''
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: SubViz ${{ steps.meta.outputs.tag }}
          files: ${{ steps.meta.outputs.zip_name }}
          draft: false
          prerelease: false
