name: Build SubViz Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

concurrency:
  group: subviz-release-main
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Resolve release version
        id: meta
        run: |
          set -euo pipefail

          if [[ -f RELEASE_VERSION.txt ]]; then
            raw_version="$(tr -d '[:space:]' < RELEASE_VERSION.txt)"
          else
            raw_version="$(node -p "require('./package.json').version")"
          fi

          if [[ -z "$raw_version" ]]; then
            echo '::error::RELEASE_VERSION.txt 为空，请填写类似 1.0.5 的版本号。'
            exit 1
          fi

          if [[ "$raw_version" == v* ]]; then
            tag="$raw_version"
          else
            tag="v$raw_version"
          fi

          if [[ ! "$tag" =~ ^v[0-9][0-9A-Za-z._-]*$ ]]; then
            echo "::error::版本号格式不正确：$tag。请使用类似 v1.0.5 的格式。"
            exit 1
          fi

          zip_name="SubViz-windows-x64-${tag}.zip"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "zip_name=$zip_name" >> "$GITHUB_OUTPUT"
          echo "release tag: $tag"
          echo "zip name: $zip_name"

      - name: Run tests
        run: npm test

      - name: Download Node.js portable
        run: |
          set -euo pipefail
          NODE_VER='v20.18.0'
          curl -fL "https://nodejs.org/dist/${NODE_VER}/node-${NODE_VER}-win-x64.zip" -o node-win.zip
          unzip -q node-win.zip
          mkdir -p dist/node
          cp -r "node-${NODE_VER}-win-x64"/* dist/node/

      - name: Download mihomo Windows x64
        run: |
          set -euo pipefail
          release_json="$(curl -fsSL https://api.github.com/repos/MetaCubeX/mihomo/releases/latest)"
          asset_url="$(printf '%s' "$release_json" | jq -r '.assets[] | select(.name | test("mihomo-windows-amd64.*\\.zip$")) | .browser_download_url' | head -n 1)"

          if [[ -z "$asset_url" || "$asset_url" == 'null' ]]; then
            echo '::error::未找到 mihomo windows amd64 zip 资产。当前最新 release 资产如下：'
            printf '%s' "$release_json" | jq -r '.assets[].name'
            exit 1
          fi

          echo "mihomo_asset=$asset_url"
          curl -fL "$asset_url" -o mihomo.zip
          unzip -q mihomo.zip -d dist/mihomo/
          find dist/mihomo -iname 'mihomo*.exe' -exec mv {} dist/mihomo/mihomo.exe \; -quit
          test -f dist/mihomo/mihomo.exe

      - name: Assemble release package
        run: |
          set -euo pipefail
          mkdir -p dist/lib dist/public dist/data dist/mihomo dist/src dist/tools dist/test

          cp server.js package.json README.md SubViz.bat SubViz.sh dist/
          if [[ -f subviz.js ]]; then cp subviz.js dist/; fi
          if [[ -d assets ]]; then cp -r assets dist/assets; fi
          cp -r lib/* dist/lib/
          cp -r public/* dist/public/
          cp -r src dist/src
          cp -r tools dist/tools
          cp -r test dist/test
          touch dist/data/.gitkeep

      - name: Verify release layout
        run: node tools/verify-release-layout.js dist

      - name: Create ZIP
        run: |
          set -euo pipefail
          cd dist
          zip -r "../${{ steps.meta.outputs.zip_name }}" .

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SubViz-windows-x64-${{ steps.meta.outputs.tag }}
          path: ${{ steps.meta.outputs.zip_name }}

      - name: Create tag when missing
        run: |
          set -euo pipefail
          tag='${{ steps.meta.outputs.tag }}'

          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "tag ${tag} already exists, keep it unchanged."
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag "$tag" "$GITHUB_SHA"
          git push origin "refs/tags/${tag}"
          echo "created tag ${tag} at ${GITHUB_SHA}"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='${{ steps.meta.outputs.tag }}'
          zip_name='${{ steps.meta.outputs.zip_name }}'

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release ${tag} already exists, uploading asset with --clobber."
            gh release upload "$tag" "$zip_name" --clobber
          else
            gh release create "$tag" "$zip_name" \
              --title "SubViz ${tag}" \
              --notes "自动构建版本 ${tag}。"
          fi
